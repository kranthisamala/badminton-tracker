<section class="state-card">
  <h2 class="section-title">Manage Access ({{ roles.length }})</h2>
  <p class="dashboard-subtitle">
    Everyone with an account can view all data. Only editors (and you, the
    owner) can make changes.
  </p>

  <div class="table-wrap" *ngIf="roles.length; else noRoles">
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of roles">
          <td>{{ r.username }}</td>
          <td>{{ r.role }}</td>
          <td>
            <button mat-stroked-button *ngIf="r.role === 'viewer'" (click)="setRole(r.uid, 'editor')">Make editor</button>
            <button mat-stroked-button *ngIf="r.role === 'editor'" (click)="setRole(r.uid, 'viewer')">Revoke edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <ng-template #noRoles><p>No accounts yet.</p></ng-template>
</section>
