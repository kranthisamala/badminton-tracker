<section class="state-card login-card">
  <h2 class="section-title">Set a new password</h2>
  <p class="dashboard-subtitle">
    This is your first sign-in. Choose a new password to replace the default one.
  </p>

  <div class="tab-form-grid">
    <mat-form-field appearance="outline" class="tab-field">
      <mat-label>New password</mat-label>
      <input matInput type="password" [(ngModel)]="newPassword" autocomplete="new-password" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="tab-field">
      <mat-label>Confirm new password</mat-label>
      <input matInput type="password" [(ngModel)]="confirmPassword" autocomplete="new-password" (keydown.enter)="submit()" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="tab-field">
      <mat-label>Contact email (optional)</mat-label>
      <input matInput type="email" [(ngModel)]="contactEmail" autocomplete="email" (keydown.enter)="submit()" />
    </mat-form-field>
  </div>

  <p class="view-only-banner" *ngIf="localError || auth.errorMessage">{{ localError || auth.errorMessage }}</p>

  <div class="actions-row">
    <button mat-flat-button color="primary" type="button" [disabled]="submitting" (click)="submit()">
      Set password
    </button>
  </div>
</section>
