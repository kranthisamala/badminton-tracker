<section class="state-card login-card">
  <h2 class="section-title">Sign in</h2>
  <p class="dashboard-subtitle">
    Use your username. First time signing in? Your password is your username
    — you'll be asked to set a new one right after.
  </p>

  <div class="tab-form-grid">
    <mat-form-field appearance="outline" class="tab-field">
      <mat-label>Username</mat-label>
      <input matInput type="text" [(ngModel)]="username" autocomplete="username" (keydown.enter)="submit()" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="tab-field">
      <mat-label>Password</mat-label>
      <input matInput type="password" [(ngModel)]="password" autocomplete="current-password" (keydown.enter)="submit()" />
    </mat-form-field>
  </div>

  <p class="view-only-banner" *ngIf="auth.errorMessage">{{ auth.errorMessage }}</p>

  <div class="actions-row">
    <button mat-flat-button color="primary" type="button" [disabled]="submitting" (click)="submit()">
      Sign in
    </button>
  </div>
</section>
